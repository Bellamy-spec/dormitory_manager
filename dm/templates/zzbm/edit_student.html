{% extends "zzbm/base.html" %}
{% block ht %}{{ head_title }}{% endblock %}

{% block content %}
<h2>修改考生信息</h2>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<form action="{% url 'zzbm:edit_student' student.id %}" role="form" method="post"
      enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="err-color">{{ err }}</p>
    <button name="submit" type="submit" class="btn btn-primary">提交</button>
</form>
<p><a href="{% url 'zzbm:list_put' task.id 0 %}">返回已报名考生列表</a></p>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script>
    new Choices('#middle_school', {
        searchEnabled: true,
        searchPlaceholderValue: '输入关键词搜索',
        searchResultLimit: 12,
        itemSelectText: '',
        shouldSort: false
    });
</script>
{% endblock %}
