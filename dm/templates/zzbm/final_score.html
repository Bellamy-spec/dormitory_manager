{% extends "zzbm/base.html" %}
{% block ht %}{{ head_title }}{% endblock %}

{% block content %}
<h3>导出最终成绩单（公示版）</h3>
<p class="tip-color">仅将身份证号置于A列即可，从第二行开始读取有效数据</p>
<form role="form" action="{% url 'zzbm:final_score' task.id %}" method="post"
      enctype="multipart/form-data">
  {% csrf_token %}
  {{ form }}
  <input type="submit" value="确定上传" class="btn btn-warning" style="margin-top: 10px;">
</form>
<p><a href="{% url 'zzbm:task_manage' task.id %}">返回上一页</a></p>
{% endblock %}
